name: Build Kernel + binfmt_misc.ko

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/kyzuna28/mainline.git
  KERNEL_BRANCH: back
  CLANG_VERSION: "22.1.8"
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo (for stored config)
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Clone kernel source
        run: |
          git clone --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          cd kernel
          # "g2819f2a0v4d" from `uname -r` is git-describe style output
          # (g<abbrev-hash>), not a valid ref on its own — resolve it to
          # a real commit first. The abbreviated hash is the part right
          # after "g"; trailing characters may be a dirty/build suffix
          # rather than part of the hash, so try progressively shorter
          # prefixes until one resolves.
          RAW="2819f2a0v4d"
          MATCH=""
          for LEN in 12 10 8 7; do
            CANDIDATE="${RAW:0:$LEN}"
            if git rev-parse --verify --quiet "${CANDIDATE}^{commit}" > /dev/null; then
              MATCH="${CANDIDATE}"
              break
            fi
          done
          if [ -z "${MATCH}" ]; then
            echo "Could not resolve g2819f2a0v4d to a commit on branch ${KERNEL_BRANCH}."
            echo "Falling back to branch tip — verify this manually before trusting the .ko:"
            git log -5 --oneline
          else
            git checkout "${MATCH}"
            echo "Pinned to commit: $(git rev-parse HEAD)"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Clean source tree
        run: |
          cd kernel
          # This tree has generated/build artifacts committed into git
          # history, which makes Kbuild's out-of-tree build (O=out) refuse
          # to proceed ("is not clean, please run 'make mrproper'").
          # mrproper wipes those so the out-of-tree build can start clean.
          make mrproper || true

      - name: Disable broken FocalTech FT8719 touchscreen driver (whole directory)
        run: |
          cd kernel
          # This driver directory has MULTIPLE files each referencing
          # separate missing vendor firmware blobs, discovered one at a
          # time as each gets reached during the build:
          #   .../focaltech_flash/focaltech_upgrade_ft8719.c
          #     -> '../include/pramboot/FT8719_Pramboot_V0.5_20171221.i'
          #   .../focaltech_flash.c
          #     -> 'include/firmware/fw_ft8719_e10.i'
          # Rather than patch each file as new ones surface, disable the
          # entire focaltech_touch_mi driver directory at the parent
          # Makefile level — unrelated to binfmt_misc/the kernel image
          # goal, and this device likely doesn't need this specific
          # Xiaomi touch panel driver anyway.
          DRIVER_DIR=$(find drivers/input/touchscreen -maxdepth 2 -type d -iname "focaltech_touch_mi" | head -n1)

          if [ -z "$DRIVER_DIR" ]; then
            echo "focaltech_touch_mi directory not found in this tree — nothing to disable, skipping."
            exit 0
          fi

          echo "Found driver directory: $DRIVER_DIR"
          PARENT_DIR=$(dirname "$DRIVER_DIR")
          DRIVER_NAME=$(basename "$DRIVER_DIR")
          PARENT_MAKEFILE="$PARENT_DIR/Makefile"

          if [ -f "$PARENT_MAKEFILE" ]; then
            echo "----- Parent Makefile before -----"
            cat "$PARENT_MAKEFILE"
            # Comment out whatever line descends into this directory,
            # whether it's `obj-y += focaltech_touch_mi/` or gated behind
            # a CONFIG_ symbol — either way, nothing inside gets built.
            sed -i "s|^\([^#].*${DRIVER_NAME}/.*\)\$|# DISABLED (missing firmware blobs): \1|" "$PARENT_MAKEFILE"
            echo "----- Parent Makefile after -----"
            cat "$PARENT_MAKEFILE"
            echo "----- Verifying no remaining active reference to ${DRIVER_NAME} -----"
            grep -n "$DRIVER_NAME" "$PARENT_MAKEFILE" || echo "(no matches — fully removed)"
          else
            echo "No Makefile at $PARENT_DIR — cannot cleanly disable via Makefile."
            echo "Falling back: renaming the driver directory so Kbuild can't find it."
            mv "$DRIVER_DIR" "${DRIVER_DIR}.disabled"
          fi

      - name: Verify NVT touch panel driver is present (actual hardware on this device)
        run: |
          cd kernel
          # Poco F1 / Beryllium shipped with two touch panel vendors
          # across production batches — FocalTech FT8719 (disabled above,
          # not present on this device) and Novatek (NVT) NT36672A, which
          # is what's actually on this device. Confirming the NVT driver
          # exists and wasn't touched by the FocalTech disable step above.
          NVT_FILES=$(find drivers/input/touchscreen -iname "*nvt*" -o -iname "*novatek*" 2>/dev/null)
          if [ -n "$NVT_FILES" ]; then
            echo "NVT/Novatek touch driver files found:"
            echo "$NVT_FILES"
          else
            echo "WARNING: no NVT/Novatek touch driver files found in this tree."
            echo "If your device uses the NVT touch panel, the flashed kernel"
            echo "will not have a working touchscreen driver for it. Check"
            echo "whether it's under a different naming convention:"
            find drivers/input/touchscreen -maxdepth 2 -type d
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 python3-pip rsync git curl wget xz-utils

      - name: Download and Install Clang ${{ env.CLANG_VERSION }} Prebuilt
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          wget "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/LLVM-${CLANG_VERSION}-Linux-X64.tar.xz"
          tar -xf "LLVM-${CLANG_VERSION}-Linux-X64.tar.xz" -C $GITHUB_WORKSPACE/toolchain --strip-components=1
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify clang version
        run: |
          clang --version || true
          # ld.lld is required for cross-linking arm64 with LLVM=1 — the
          # host's default GNU ld only knows x86 emulations and fails with
          # "unrecognised emulation mode: aarch64linux" otherwise.
          ld.lld --version || echo "WARNING: ld.lld not found in this toolchain archive — cross-linking arm64 will fail"

      - name: Apply stored device config
        run: |
          # Placed in out/ (not the source root) — Kbuild's out-of-tree
          # build (O=out) treats any build-artifact-like file sitting in
          # the source root, including .config, as a "dirty" source tree
          # and refuses to proceed. out/.config is the correct location.
          mkdir -p kernel/out
          cp workflow-repo/.github/workflows/configs/kernel.config kernel/out/.config

      - name: Disable KernelSU / SUSFS (build a normal, non-rooted kernel)
        run: |
          cd kernel
          # This source tree ships with KernelSU-Next's kernel-side hooks
          # and SUSFS baked in (confirmed present in the dumped device
          # config). Turning all of it off so the resulting kernel has no
          # root/hook integration at all — a plain kernel image.
          for opt in \
            CONFIG_KSU \
            CONFIG_KSU_DEBUG \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MOUNT \
            CONFIG_KSU_SUSFS_SUS_KSTAT \
            CONFIG_KSU_SUSFS_TRY_UMOUNT \
            CONFIG_KSU_SUSFS_SPOOF_UNAME \
            CONFIG_KSU_SUSFS_ENABLE_LOG \
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            CONFIG_KSU_SUSFS_SUS_MAP \
            CONFIG_KSU_SUSFS_SUS_MEMFD \
            CONFIG_KSU_DISABLE_MANAGER \
            CONFIG_KSU_DISABLE_POLICY \
            CONFIG_KSU_ALLOWLIST_WORKAROUND
          do
            sed -i "/^${opt}=/d" out/.config
            sed -i "/# ${opt} is not set/d" out/.config
            echo "# ${opt} is not set" >> out/.config
          done
          echo "----- Remaining KSU/SUSFS lines after disabling (should all show 'is not set') -----"
          grep -iE "KSU" out/.config || echo "(none found — fully removed)"

      - name: Enable required config symbols (binfmt_misc + namespace/container/overlay)
        run: |
          cd kernel
          # All =y, built directly into the kernel image — no separate
          # .ko or boot-time loading script needed for any of these.
          for opt in \
            CONFIG_BINFMT_MISC \
            CONFIG_USER_NS \
            CONFIG_NET_NSH \
            CONFIG_KPROBES \
            CONFIG_CHECKPOINT_RESTORE \
            CONFIG_ANDROID_BINDER_IPC_SELFTEST \
            CONFIG_OVERLAY_FS_REDIRECT_DIR \
            CONFIG_OVERLAY_FS_INDEX \
            CONFIG_OVERLAY_FS_XINO_AUTO \
            CONFIG_OVERLAY_FS_METACOPY \
            CONFIG_FHANDLE \
            CONFIG_SQUASHFS \
            CONFIG_XZ_DEC \
            CONFIG_SECURITYFS
          do
            sed -i "/# ${opt} is not set/d" out/.config
            if grep -q "^${opt}=" out/.config; then
              sed -i "s/^${opt}=.*/${opt}=y/" out/.config
            else
              echo "${opt}=y" >> out/.config
            fi
          done
          grep -E "CONFIG_BINFMT_MISC|CONFIG_USER_NS|CONFIG_OVERLAY_FS|CONFIG_SQUASHFS" out/.config

      - name: Reconcile config (olddefconfig)
        run: |
          cd kernel
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Confirm symbol landed after reconciliation
        run: |
          cd kernel
          grep BINFMT_MISC out/.config
          grep -A6 "^config BINFMT_MISC" fs/Kconfig.binfmt || true

      - name: Prepare modules
        run: |
          cd kernel
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare

      - name: Build full kernel image
        run: |
          cd kernel
          # This step is now the actual point of the workflow — the goal
          # is a flashable image with BINFMT_MISC=y baked in, not just a
          # standalone .ko. Known blocker: this tree is missing a vendor
          # firmware blob for an unrelated touchscreen driver
          # (drivers/input/touchscreen/xiaomi/.../FT8719_Pramboot_....i)
          # which will fail this build until that's fixed (restore the
          # blob, or patch that driver out of the build).
          #
          # Output redirected to a log file rather than streamed live —
          # GitHub Actions' log streamer can fall behind on a build this
          # verbose, and when the pipe backs up an LLVM tool trying to
          # write to stdout gets a broken pipe and aborts (even if the
          # actual compile step was otherwise fine). Only the tail is
          # shown on failure so the real error is still visible.
          set +e
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 -j"$(nproc)" > ../build.log 2>&1
          STATUS=$?
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "----- last 200 lines of build.log -----"
            tail -n 200 ../build.log
            exit $STATUS
          fi
          echo "Kernel build finished."

      - name: Fetch AK3 template
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1_9swZ7pelAf2tChCIX53uu0ZPvOJWTZM" -O "Xun-mainline-lastbuild_4.19-20260807180156.zip"

          mkdir -p AK3_extracted AK3
          unzip -o "Xun-mainline-lastbuild_4.19-20260807180156.zip" -d AK3_extracted

          # Copy everything from the template except the old kernel image —
          # anykernel.sh, ramdisk patches, KernelSU-Next installer scripts,
          # etc. all carry over unchanged; only Image.gz-dtb gets replaced
          # with what this run just built.
          find AK3_extracted -type f ! -name "Image.gz-dtb" -print0 | \
          while IFS= read -r -d '' f; do
            rel="${f#AK3_extracted/}"
            mkdir -p "AK3/$(dirname "$rel")"
            cp "$f" "AK3/$rel"
          done

      - name: Check AK3 template for embedded KernelSU references
        run: |
          # Not confirmed whether anykernel.sh bundles a KSU installer
          # inline vs. it being a separate flash-afterward module (the
          # original build notes list KernelSU-Next as a "Mandatory
          # module" bullet alongside Mount Module/Multi Manager, which
          # usually means separate zips, not embedded). Flagging any
          # matches here for manual review rather than guessing at what
          # to strip — the kernel config change alone (CONFIG_KSU
          # disabled) already means KSU has nothing to hook into even if
          # something references it in the ramdisk.
          echo "----- Files/strings mentioning ksu/kernelsu in the AK3 template -----"
          grep -rli "ksu\|kernelsu" AK3/ 2>/dev/null || echo "(no matches found)"
          echo ""
          echo "Review any matches above before flashing. Since CONFIG_KSU is"
          echo "disabled in this build's config, KSU hooks are not present in"
          echo "the kernel itself regardless of what the ramdisk references."

      - name: Package flashable AK3 zip
        run: |
          # This tree's full kernel build is expected to fail on an
          # unrelated missing vendor blob (see "Build full kernel image"
          # above), so Image/Image.gz-dtb may not exist. Only package if
          # the build actually produced one — skip cleanly otherwise
          # rather than shipping a broken zip.
          IMAGE_PATH=""
          for candidate in \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            kernel/out/arch/arm64/boot/Image.gz \
            kernel/out/arch/arm64/boot/Image
          do
            if [ -f "$candidate" ]; then
              IMAGE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE_PATH" ]; then
            echo "No kernel Image found — full kernel build did not complete"
            echo "(see 'Build full kernel image' step log / build-log artifact)."
            echo "Skipping AK3 packaging; only binfmt_misc.ko is available this run."
            exit 0
          fi

          cp "$IMAGE_PATH" AK3/Image.gz-dtb
          cd AK3
          zip -r9 "../Xun-mainline-${KERNEL_COMMIT}.zip" . -x ".git*"
          cd ..
          ls -la "Xun-mainline-${KERNEL_COMMIT}.zip"

      - name: Upload flashable AK3 zip
        uses: actions/upload-artifact@v4
        with:
          name: flashable-zip-${{ env.KERNEL_COMMIT }}
          path: Xun-mainline-*.zip
          if-no-files-found: ignore

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image-${{ env.KERNEL_COMMIT }}
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/.config

      - name: Upload full build log (always, for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.KERNEL_COMMIT }}
          path: build.log
          if-no-files-found: ignore
          

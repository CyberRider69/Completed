name: Build Kernel + enable symbols 

on:
  workflow_dispatch:

env:
  KERNEL_REPO: https://github.com/kyzuna28/mainline.git
  KERNEL_BRANCH: back
  CLANG_VERSION: "22.1.8"
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow repo (for stored config)
        uses: actions/checkout@v4
        with:
          path: workflow-repo

      - name: Clone kernel source
        run: |
          git clone --branch "${KERNEL_BRANCH}" "${KERNEL_REPO}" kernel
          cd kernel
          MATCH=""
          for CANDIDATE in "54cd93e4b"; do
            if git rev-parse --verify --quiet "${CANDIDATE}^{commit}" > /dev/null; then
              MATCH="${CANDIDATE}"
              break
            fi
          done
          if [ -n "${MATCH}" ]; then
            git checkout "${MATCH}"
            echo "Pinned to commit: $(git rev-parse HEAD)"
          else
            echo "Candidate commit not found, staying on branch ${KERNEL_BRANCH}"
          fi
          echo "KERNEL_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          
      - name: Clean 
        run: |
          cd kernel
          make mrproper || true

      - name: Disable broken FocalTech FT8719 touchscreen driver (whole directory)
        run: |
          cd kernel
          DRIVER_DIR=$(find drivers/input/touchscreen -maxdepth 2 -type d -iname "focaltech_touch_mi" | head -n1)

          if [ -z "$DRIVER_DIR" ]; then
            echo "focaltech_touch_mi directory not found in this tree — nothing to disable, skipping."
            exit 0
          fi

          echo "Found driver directory: $DRIVER_DIR"
          PARENT_DIR=$(dirname "$DRIVER_DIR")
          DRIVER_NAME=$(basename "$DRIVER_DIR")
          PARENT_MAKEFILE="$PARENT_DIR/Makefile"

          if [ -f "$PARENT_MAKEFILE" ]; then
            echo "----- Parent Makefile before -----"
            cat "$PARENT_MAKEFILE"
            # Comment out whatever line descends into this directory,
            # whether it's `obj-y += focaltech_touch_mi/` or gated behind
            # a CONFIG_ symbol — either way, nothing inside gets built.
            sed -i "s|^\([^#].*${DRIVER_NAME}/.*\)\$|# DISABLED (missing firmware blobs): \1|" "$PARENT_MAKEFILE"
            echo "----- Parent Makefile after -----"
            cat "$PARENT_MAKEFILE"
            echo "----- Verifying no remaining active reference to ${DRIVER_NAME} -----"
            grep -n "$DRIVER_NAME" "$PARENT_MAKEFILE" || echo "(no matches — fully removed)"
          else
            echo "No Makefile at $PARENT_DIR — cannot cleanly disable via Makefile."
            echo "Falling back: renaming the driver directory so Kbuild can't find it."
            mv "$DRIVER_DIR" "${DRIVER_DIR}.disabled"
          fi

      - name: Verify NVT touch panel driver is present (actual hardware on this device)
        run: |
          cd kernel
          NVT_FILES=$(find drivers/input/touchscreen -iname "*nvt*" -o -iname "*novatek*" 2>/dev/null)
          if [ -n "$NVT_FILES" ]; then
            echo "NVT/Novatek touch driver files found:"
            echo "$NVT_FILES"
          else
            echo "WARNING: no NVT/Novatek touch driver files found in this tree."
            find drivers/input/touchscreen -maxdepth 2 -type d
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex libssl-dev libelf-dev \
            python3 python3-pip rsync git curl wget xz-utils

      - name: Download and Install Clang ${{ env.CLANG_VERSION }} Prebuilt
        run: |
          mkdir -p $GITHUB_WORKSPACE/toolchain
          wget "https://github.com/llvm/llvm-project/releases/download/llvmorg-${CLANG_VERSION}/LLVM-${CLANG_VERSION}-Linux-X64.tar.xz"
          tar -xf "LLVM-${CLANG_VERSION}-Linux-X64.tar.xz" -C $GITHUB_WORKSPACE/toolchain --strip-components=1
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Verify clang version
        run: |
          clang --version || true
          ld.lld --version || echo "WARNING: ld.lld not found in this toolchain archive — cross-linking arm64 will fail"

      - name: Apply stored device config
        run: |
          mkdir -p kernel/out
          cp workflow-repo/.github/workflows/configs/kernel.config kernel/out/.config

      - name: Patch qpnp-smb2.c bypass-charging duplication (precise, two-part fix)
        run: |
          cd kernel
          SMB2_FILE="drivers/power/supply/qcom/qpnp-smb2.c"

          if [ ! -f "$SMB2_FILE" ]; then
            echo "$SMB2_FILE not found in this tree — nothing to patch."
            exit 0
          fi

          python3 << 'PYEOF'
          path = "drivers/power/supply/qcom/qpnp-smb2.c"
          with open(path) as f:
              lines = f.readlines()

          def find_one(marker, lines):
              matches = [i for i, l in enumerate(lines) if marker in l]
              return matches

          # --- Part A: remove local is_bypass_active/bypass_charge_set_active shadow ---
          a_start_matches = find_one("is_bypass_active(void)", lines)
          a_end_matches = find_one("static ssize_t bypass_charging_show(struct kobject *kobj,", lines)

          if len(a_start_matches) != 1 or len(a_end_matches) < 1:
              print(f"Part A: expected exactly 1 'is_bypass_active(void)' "
                    f"(found {len(a_start_matches)}) and at least 1 "
                    f"'bypass_charging_show' definition start "
                    f"(found {len(a_end_matches)}). Aborting — file "
                    f"structure differs from what was inspected.")
          else:
              a_start = a_start_matches[0]
              a_end = a_end_matches[0]  # first occurrence = Block 1's show, our boundary
              print(f"Part A: removing lines {a_start + 1}-{a_end} "
                    f"({a_end - a_start} lines) — local is_bypass_active/"
                    f"bypass_charge_set_active shadow of smb-lib.h")
              lines = lines[:a_start] + lines[a_end:]

              # --- Part B: remove the second (duplicate) implementation block ---
              b_start_matches = find_one("bypass_charging_val = 0;", lines)
              sysfs_init_matches = find_one("void bypass_charge_sysfs_init(struct smb_charger *chg)", lines)

              if len(b_start_matches) != 1 or len(sysfs_init_matches) != 2:
                  print(f"Part B: expected exactly 1 'bypass_charging_val = 0;' "
                        f"(found {len(b_start_matches)}) and exactly 2 "
                        f"'bypass_charge_sysfs_init' definitions "
                        f"(found {len(sysfs_init_matches)}) after Part A. "
                        f"Aborting Part B — Part A's change (if valid) is "
                        f"still saved; review Part B manually.")
                  with open(path, 'w') as f:
                      f.writelines(lines)
              else:
                  b_start = b_start_matches[0]
                  b_sysfs_start = sysfs_init_matches[-1]  # second occurrence = Block 2's duplicate

                  # Brace-count from Block 2's sysfs_init to find its closing brace
                  depth = 0
                  started = False
                  b_end = None
                  for i in range(b_sysfs_start, len(lines)):
                      depth += lines[i].count('{')
                      depth -= lines[i].count('}')
                      if '{' in lines[i]:
                          started = True
                      if started and depth == 0:
                          b_end = i
                          break

                  if b_end is None:
                      print("Part B: could not find matching closing brace "
                            "for the duplicate bypass_charge_sysfs_init — "
                            "aborting Part B. Part A's change is saved; "
                            "review Part B manually.")
                      with open(path, 'w') as f:
                          f.writelines(lines)
                  else:
                      print(f"Part B: removing lines {b_start + 1}-{b_end + 1} "
                            f"({b_end - b_start + 1} lines) — duplicate "
                            f"reimplementation block")
                      lines = lines[:b_start] + lines[b_end + 1:]
                      with open(path, 'w') as f:
                          f.writelines(lines)
                      print("Both parts patched successfully.")
          PYEOF

          echo ""
          echo "----- Post-patch verification -----"
          echo "is_bypass_active occurrences (expect 0, header copy is in smb-lib.h):"
          grep -c "is_bypass_active(void)" "$SMB2_FILE" || true
          echo "bypass_charge_sysfs_init occurrences (expect 1):"
          grep -c "void bypass_charge_sysfs_init" "$SMB2_FILE" || true
          echo "bypass_charge_sysfs_exit occurrences (expect 1):"
          grep -c "void bypass_charge_sysfs_exit" "$SMB2_FILE" || true

      - name: Enable required config symbols (binfmt_misc + namespace/container/overlay)
        run: |
          cd kernel
          # All =y, built directly into the kernel image
          for opt in \
            CONFIG_BINFMT_MISC \
            CONFIG_USER_NS \
            CONFIG_NET_NSH \
            CONFIG_KPROBES \
            CONFIG_CHECKPOINT_RESTORE \
            CONFIG_DEVTMPFS_MOUNT \
            CONFIG_VT \
            CONFIG_SQUASHFS \
            CONFIG_XZ_DEC \
            CONFIG_FANOTIFY \
            CONFIG_SECURITYFS \
            CONFIG_KCMP
          do
            ./scripts/config --file out/.config --enable "${opt#CONFIG_}"
          done

      - name: Backport openat2() syscall (missing in this tree, breaks systemd 261.2 machine-id setup)
        run: |
          cd kernel

          # 1. uapi header: struct open_how + RESOLVE_* flags
          cat > include/uapi/linux/openat2.h << 'HDREOF'
          #ifndef _UAPI_LINUX_OPENAT2_H
          #define _UAPI_LINUX_OPENAT2_H

          #include <linux/types.h>

          struct open_how {
          	__u64 flags;
          	__u64 mode;
          	__u64 resolve;
          };

          #define OPEN_HOW_SIZE_VER0	24 /* sizeof first published struct */

          #define RESOLVE_NO_XDEV		0x01
          #define RESOLVE_NO_MAGICLINKS	0x02
          #define RESOLVE_NO_SYMLINKS	0x04
          #define RESOLVE_BENEATH		0x08
          #define RESOLVE_IN_ROOT		0x10

          #endif /* _UAPI_LINUX_OPENAT2_H */
          HDREOF

          # 2. Minimal implementation as its own translation unit — kept out of
          #    fs/open.c on purpose so this backport never conflicts with the
          #    existing do_sys_open()/build_open_flags() path on this tree.
          #    NOTE: this is a MINIMAL backport. RESOLVE_* path-resolution
          #    flags (BENEATH/IN_ROOT/NO_SYMLINKS etc.) are rejected with
          #    -EINVAL rather than implemented, since that requires namei.c
          #    changes this tree doesn't have. systemd's machine-id setup
          #    path calls openat2() with resolve=0 in the common case, which
          #    this backport handles as a normal open().
          cat > fs/openat2_backport.c << 'SRCEOF'
          // SPDX-License-Identifier: GPL-2.0
          /* Minimal openat2(2) backport for kernels predating 5.6.
           *
           * build_open_flags()/do_filp_open() are static/internal-linkage in
           * this tree's fs/open.c, so they cannot be called from here even
           * with fs/internal.h included. Instead this reuses do_sys_open(),
           * the older single-function open path (still present and declared
           * in fs/internal.h on kernels pre-dating the 5.6 openat2 refactor)
           * which does flag-building + path lookup + fd install internally.
           * Since this backport unconditionally rejects any RESOLVE_* flag,
           * we never need the lower-level split — do_sys_open() covers every
           * case this backport actually accepts.
           */
          #include <linux/kernel.h>
          #include <linux/fs.h>
          #include <linux/file.h>
          #include <linux/syscalls.h>
          #include <linux/uaccess.h>
          #include <linux/sched.h>
          #include <uapi/linux/openat2.h>
          #include "internal.h"

          SYSCALL_DEFINE4(openat2, int, dfd, const char __user *, filename,
          		 struct open_how __user *, how, size_t, usize)
          {
          	struct open_how tmp;

          	if (unlikely(usize < OPEN_HOW_SIZE_VER0))
          		return -EINVAL;
          	if (unlikely(usize > PAGE_SIZE))
          		return -E2BIG;

          	memset(&tmp, 0, sizeof(tmp));
          	if (usize > sizeof(tmp)) {
          		/* caller passed a newer/larger struct than we know;
          		 * only accept if the extra tail is all zero */
          		char __user *addr = (char __user *)how + sizeof(tmp);
          		size_t rest = usize - sizeof(tmp);
          		while (rest--) {
          			char c;

          			if (get_user(c, addr++))
          				return -EFAULT;
          			if (c)
          				return -E2BIG;
          		}
          		usize = sizeof(tmp);
          	}
          	if (copy_from_user(&tmp, how, usize))
          		return -EFAULT;

          	/* Minimal backport: no RESOLVE_* support yet. */
          	if (tmp.resolve != 0)
          		return -EINVAL;

          	return do_sys_open(dfd, filename, (int)tmp.flags, (umode_t)tmp.mode);
          }
          SRCEOF

          # 3. Wire the new object into the build
          if ! grep -q "openat2_backport.o" fs/Makefile; then
            echo "obj-y += openat2_backport.o" >> fs/Makefile
          fi

          # 4. Native (64-bit) syscall table + count
          NATIVE_UNISTD="include/uapi/asm-generic/unistd.h"
          if ! grep -q "__NR_openat2" "$NATIVE_UNISTD"; then
            python3 - << 'PYEOF'
          path = "include/uapi/asm-generic/unistd.h"
          with open(path) as f:
              lines = f.readlines()
          out = []
          inserted = False
          for line in lines:
              if not inserted and line.strip().startswith("#define __NR_syscalls"):
                  out.append("#define __NR_openat2 437\n")
                  out.append("__SYSCALL(__NR_openat2, sys_openat2)\n")
                  # bump the count that follows on this same line
                  parts = line.split()
                  old_count = int(parts[-1])
                  new_count = max(old_count, 438)
                  line = f"#define __NR_syscalls {new_count}\n"
                  inserted = True
              out.append(line)
          if not inserted:
              raise SystemExit("Could not find __NR_syscalls line — check file format manually")
          with open(path, "w") as f:
              f.writelines(out)
          PYEOF
          fi

          # 5. Compat (32-bit) syscall table
          COMPAT_UNISTD="arch/arm64/include/asm/unistd32.h"
          if ! grep -q "__NR_openat2" "$COMPAT_UNISTD"; then
            python3 - << 'PYEOF'
          path = "arch/arm64/include/asm/unistd32.h"
          with open(path) as f:
              lines = f.readlines()
          out = []
          inserted = False
          for i, line in enumerate(lines):
              out.append(line)
              if not inserted and line.strip() == "#define __NR_finit_module 379":
                  out.insert(len(out) - 1, "#define __NR_openat2 437\n")
                  out.insert(len(out) - 1, "__SYSCALL(__NR_openat2, sys_openat2)\n")
                  inserted = True
          if not inserted:
              raise SystemExit("Could not find anchor line in unistd32.h — check file format manually")
          with open(path, "w") as f:
              f.writelines(out)
          PYEOF
          fi

          echo "----- Verification -----"
          grep -n "openat2\|__NR_syscalls" include/uapi/asm-generic/unistd.h
          grep -n "openat2" arch/arm64/include/asm/unistd32.h
          grep -n "openat2_backport" fs/Makefile

      - name: Backport kernel/kcmp.c (source file missing from this tree)
        run: |
          cd kernel

          # 1. Fetch canonical kcmp.c from a matching 4.19 upstream tag.
          #    kcmp is small/self-contained (task/fd comparison only) — no
          #    VFS internals, so a straight drop-in from the same major
          #    version compiles cleanly without adaptation.
          if [ ! -f kernel/kcmp.c ]; then
            echo "kernel/kcmp.c missing — fetching from upstream v4.19"
            wget -q "https://raw.githubusercontent.com/torvalds/linux/v4.19/kernel/kcmp.c" -O kernel/kcmp.c
            if [ ! -s kernel/kcmp.c ]; then
              echo "ERROR: download failed or empty file — aborting this step"
              exit 1
            fi
            echo "Fetched kernel/kcmp.c ($(wc -l < kernel/kcmp.c) lines)"
          else
            echo "kernel/kcmp.c already present — leaving as-is"
          fi

          # 2. Ensure kernel/Makefile actually builds it
          if ! grep -q "kcmp.o" kernel/Makefile; then
            echo "obj-\$(CONFIG_KCMP) += kcmp.o" >> kernel/Makefile
            echo "Added kcmp.o build rule to kernel/Makefile"
          else
            echo "kernel/Makefile already references kcmp.o"
          fi

          # 3. Ensure a Kconfig entry exists to actually select it
          if ! grep -rq "^config KCMP$" --include='Kconfig*' .; then
            echo "No Kconfig entry for KCMP found — adding minimal stanza to init/Kconfig"
            if [ -f init/Kconfig ] && grep -q "^config CHECKPOINT_RESTORE$" init/Kconfig; then
              python3 - << 'PYEOF'
          path = "init/Kconfig"
          with open(path) as f:
              content = f.read()
          anchor = "config CHECKPOINT_RESTORE"
          idx = content.find(anchor)
          if idx == -1:
              raise SystemExit("Anchor not found — add KCMP Kconfig entry manually")
          # find end of this config block (next blank-line-preceded 'config ' or 'endmenu'/'endif')
          end = content.find("\nconfig ", idx + len(anchor))
          if end == -1:
              end = len(content)
          stanza = (
              "\nconfig KCMP\n"
              "\tbool \"Enable kcmp() system call\" if EXPERT\n"
              "\tdefault y if CHECKPOINT_RESTORE\n"
              "\thelp\n"
              "\t  Enable the kernel resource comparison syscall, used by\n"
              "\t  CRIU and by userspace sandboxing/container tools (NetHunter\n"
              "\t  chroot) to compare two processes' resources (fds, mm, etc).\n"
              "\t  If unsure say N.\n"
          )
          content = content[:end] + stanza + content[end:]
          with open(path, "w") as f:
              f.write(content)
          PYEOF
              echo "Kconfig entry added"
            else
              echo "WARNING: could not locate init/Kconfig or CHECKPOINT_RESTORE anchor."
              echo "Add the KCMP Kconfig stanza manually before this will build."
              exit 1
            fi
          else
            echo "Kconfig entry for KCMP already exists"
          fi

          echo "----- Verification -----"
          ls -la kernel/kcmp.c
          grep -n "kcmp" kernel/Makefile
          grep -n "^config KCMP" init/Kconfig

      - name: Check which symbols actually exist in this tree's Kconfig
        run: |
          cd kernel
          for opt in UPROBES XZ_DEC CHECKPOINT_RESTORE \
            SECURITYFS VT NET_NSH DEVTMPFS_MOUNT USER_NS \
            BINFMT_MISC SQUASHFS KPROBES KCMP ; do
            if grep -rq "^config ${opt}\$" --include='Kconfig*' .; then
              echo "REAL   CONFIG_${opt}"
            else
              echo "GHOST  CONFIG_${opt}  <- no Kconfig entry in this tree, enabling it does nothing"
            fi
          done

      - name: Reconcile config (olddefconfig)
        run: |
          cd kernel
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Verify final config
        run: |
          cd kernel
          echo "Checking out/.config BEFORE build (this is what actually gets compiled):"
          grep -E "CONFIG_BINFMT_MISC|CONFIG_USER_NS|CONFIG_NET_NSH|CONFIG_KPROBES|CONFIG_CHECKPOINT_RESTORE|CONFIG_DEVTMPFS_MOUNT|CONFIG_VT|CONFIG_SQUASHFS|CONFIG_XZ_DEC|CONFIG_FANOTIFY|CONFIG_SECURITYFS|CONFIG_KCMP" out/.config

          echo ""
          echo "--- NetHunter-critical subset (chroot/container/KeX depend on these) ---"
          for opt in USER_NS KROPBES CHECKPOINT_RESTORE DEVTMPFS_MOUNT VT SQUASHFS XZ_DEC FANOTIFY SECURITYFS KCMP BINFMT_MISC ; do
            line=$(grep "^CONFIG_${opt}=" out/.config || true)
            if [ -n "$line" ]; then
              echo "OK    $line"
            else
              echo "MISSING  CONFIG_${opt}  <- dropped by olddefconfig, NetHunter functionality may break"
            fi
          done

      - name: Build full kernel image
        run: |
          cd kernel
          # This step is now the actual point of the workflow
          set +e
          make ARCH=${ARCH} O=out CC=clang LLVM=1 LLVM_IAS=1 --output-sync=target -j"$(nproc)" 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ $STATUS -ne 0 ]; then
            echo "Kernel build not finished."
            exit $STATUS
          fi
          echo "Kernel build finished."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.KERNEL_COMMIT }}
          path: build.log
          
      - name: Fetch AK3 template
        run: |
          pip install gdown
          gdown "https://drive.google.com/uc?id=1dv-XzO_YaJwcm6cEfqGylCvq1PUuNNxb" -O beryllium_419-fast_charge.zip

          mkdir -p AK3_extracted AK3
          unzip -o beryllium_419-fast_charge.zip -d AK3_extracted

          find AK3_extracted -type f ! -name Image.gz-dtb -print0 | \
          while IFS= read -r -d '' f; do
            rel="${f#AK3_extracted/}"
            mkdir -p "AK3/$(dirname "$rel")"
            cp "$f" "AK3/$rel"
          done

      - name: Package flashable AK3 zip
        run: |
          # This tree's full kernel build is expected to fail for an unrelated missing vendor blob
          IMAGE_PATH=""
          for candidate in \
            kernel/out/arch/arm64/boot/Image.gz-dtb \
            kernel/out/arch/arm64/boot/Image.gz \
            kernel/out/arch/arm64/boot/Image
          do
            if [ -f "$candidate" ]; then
              IMAGE_PATH="$candidate"
              break
            fi
          done

          if [ -z "$IMAGE_PATH" ]; then
            echo "No kernel Image found — full kernel build did not complete"
            echo "(see 'Build full kernel image' step log / build-log artifact)."
            exit 0
          fi

          cp "$IMAGE_PATH" AK3/Image.gz-dtb
          cd AK3
          zip -r9 "../beryllium_419-fast_charge_smb2cpatch-${KERNEL_COMMIT}.zip" . -x ".git*"
          cd ..
          ls -la "beryllium_419-fast_charge_smb2cpatch-${KERNEL_COMMIT}.zip"

      - name: Upload flashable AK3 zip
        uses: actions/upload-artifact@v4
        with:
          name: beryllium_419-fast_charge_smb2cpatch-${{ env.KERNEL_COMMIT }}
          path: beryllium_419-fast_charge_smb2cpatch-*.zip
